name: Bug report
description: Something doesn't work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Do not paste personal data**: no real CVs, names, contact details, job postings
        tied to a real person, or recordings. Replace them with fictional text before you attach logs or screenshots.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Practice
        2. Start a voice interview
        3. ...
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: AI engine
      options:
        - Ollama
        - OpenAI-compatible server
        - Claude Code CLI
        - Gemini Live
        - Not related to the engine
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model
      placeholder: qwen3:4b-instruct
  - type: dropdown
    id: mode
    attributes:
      label: Answer mode
      options:
        - Voice
        - Typed
        - Both / not sure
  - type: input
    id: environment
    attributes:
      label: OS, browser and versions
      placeholder: macOS 15 on Apple Silicon, Chrome 140, Python 3.12, commit abc1234
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Backend console output or browser console errors, with any personal data removed.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Personal data
      options:
        - label: This report contains no real CVs, names, contact details or recordings.
          required: true
