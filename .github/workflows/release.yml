name: Release

# Tag vX.Y.Z -> build vukoli.zip + SHA256SUMS and attach them to the GitHub Release.
# The one-command installers download exactly these two files from
# https://github.com/VladPolyakov-art/vukoli/releases/latest/download/

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish vukoli.zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build the archive (web app included)
        env:
          TAG: ${{ github.ref_name }}
        run: python install/build_release.py --out dist-release --version "${TAG#v}"
      - name: Check the archive
        run: |
          python - <<'PY'
          import zipfile
          z = zipfile.ZipFile("dist-release/vukoli.zip")
          names = z.namelist()
          for need in ("vukoli/VERSION", "vukoli/server/requirements.txt", "vukoli/web/dist/index.html", "vukoli/install/install.sh"):
              assert need in names, f"missing {need}"
          info = z.getinfo("vukoli/install/install.sh")
          assert (info.external_attr >> 16) & 0o111, "install.sh lost its exec bit"
          print(len(names), "files OK")
          PY
          cat dist-release/SHA256SUMS
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" dist-release/vukoli.zip dist-release/SHA256SUMS --clobber --repo "$REPO"
          else
            gh release create "$TAG" dist-release/vukoli.zip dist-release/SHA256SUMS \
              --repo "$REPO" --title "Vukoli $TAG" --generate-notes --verify-tag
          fi
