name: E2E

# The Playwright suite (docs/e2e.md) in 6 parallel shards, desktop and mobile projects.
# Each shard builds the web app and runs the backend in test mode (IC_E2E=1: a scripted AI engine,
# no real model, no microphone, no network): see web/scripts/e2e-server.mjs.
# Runs only in the public repository (free Actions minutes); the private source repo skips it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E (shard ${{ matrix.shard }}/6)
    if: github.repository == 'VladPolyakov-art/vukoli'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements*.txt
      - name: Server dependencies
        run: python -m pip install -r server/requirements-dev.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Web dependencies
        working-directory: web
        run: npm ci
      - name: Chromium for Playwright
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: E2E shard ${{ matrix.shard }}/6
        working-directory: web
        run: npx playwright test --fully-parallel --shard=${{ matrix.shard }}/6 --reporter=list
      - name: Failure traces and screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-shard-${{ matrix.shard }}
          path: |
            web/test-results/
            web/.e2e-data/*/server.log
          retention-days: 7
